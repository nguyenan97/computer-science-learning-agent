name: Optional Lesson Diagnostics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-diagnostics:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - name: Benchmark harness smoke check
        continue-on-error: true
        run: python scripts/check_all.py --benchmarks-only
      - name: Install browser check dependencies
        continue-on-error: true
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify rendered lesson links and language switching
        continue-on-error: true
        run: |
          python scripts/build_public_site.py --output .site-build
          python scripts/check_lesson_site.py --site .site-build --document-delay-ms 800
      - name: Verify desktop and mobile reading interactions
        continue-on-error: true
        run: python scripts/check_lesson_ui.py --site .site-build
