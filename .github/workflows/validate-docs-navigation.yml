name: Validate Docs Navigation

on:
  push:
    paths:
      - '**/*.md'
      - 'index.html'
      - 'scripts/validate_docs_navigation.py'
      - '.github/workflows/validate-docs-navigation.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'index.html'
      - 'scripts/validate_docs_navigation.py'
      - '.github/workflows/validate-docs-navigation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docsify navigation
        run: python3 scripts/validate_docs_navigation.py
