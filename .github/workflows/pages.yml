name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-learning.yml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public content only
        run: python3 scripts/build_public_site.py --output .site-build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
